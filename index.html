<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIGMA-SKILLINE-DESIGN</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- wrapper -->
      <div class="webpage-1">
        <!-- webpage 1 -->
        <div class="footer">
          <!-- footer -->
          <footer>
            <div class="logo">
              <h1 class="h1">Skilline</h1>
              <div class="polygon">
                <img src="images/Polygon-1.png" alt="Polygon-1" />
              </div>
            </div>
            <nav class="navs">
              <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Careers</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">About Us</a></li>
              </ul>
            </nav>
            <div class="buttons">
              <button class="white">Login</button>
              <button class="orange">Sign Up</button>
            </div>
          </footer>
          <div class="columns">
            <!-- columns -->
            <div class="column-1">
              <!-- column 1 -->
              <h1 class="c-heading">
                <span class="span">Studying</span> Online is now much easier
              </h1>
              <p class="paragraph">
                Skilline is an interesting platform that will teach <br />
                you in more an interactive way
              </p>

              <div class="watch">
                <button class="join">Join for free</button>

                <img src="images/Group-4.png" alt="Group-4" />
                <p>Watch how it works</p>
              </div>
            </div>
            <div class="column-2">
              <!-- column 2 -->
              <div>
                <img src="images/header-pic.png" alt="header-pic" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
